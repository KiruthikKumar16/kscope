<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kscope - Fleet Tracking Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .alert-card { border-left: 4px solid #dc3545; }
        .alert-card.warning { border-left-color: #ffc107; }
        .alert-card.info { border-left-color: #17a2b8; }
        .alert-card.success { border-left-color: #28a745; }
        .vehicle-card { transition: all 0.3s ease; }
        .vehicle-card:hover { transform: translateY(-2px); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); }
        .speedometer { width: 100px; height: 100px; }
        .fuel-gauge { width: 60px; height: 60px; }
        #map { height: 400px; border-radius: 0.375rem; }
        .status-indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-running { background-color: #28a745; }
        .status-stopped { background-color: #dc3545; }
        .severity-critical { color: #dc3545; }
        .severity-high { color: #fd7e14; }
        .severity-medium { color: #ffc107; }
        .severity-low { color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-truck"></i> kscope Fleet Tracking
            </a>
            <div class="navbar-nav ms-auto">
                <div class="btn-group me-3" role="group">
                    <button class="btn btn-outline-light btn-sm" onclick="exportTelemetry()">
                        <i class="fas fa-download"></i> Export Telemetry
                    </button>
                    <button class="btn btn-outline-light btn-sm" onclick="exportAnalytics()">
                        <i class="fas fa-chart-bar"></i> Export Analytics
                    </button>
                    <button class="btn btn-outline-light btn-sm" onclick="exportVehicleDetails()">
                        <i class="fas fa-list"></i> Export Details
                    </button>
                </div>
                <span class="navbar-text">
                    <i class="fas fa-circle text-success" id="statusIndicator"></i> 
                    <span id="statusText">Live</span>
                    <small class="ms-2" id="lastUpdate">-</small>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Analytics Summary -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary">
                            <i class="fas fa-truck"></i> Total Vehicles
                        </h5>
                        <h2 id="totalVehicles">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success">
                            <i class="fas fa-play-circle"></i> Running
                        </h5>
                        <h2 id="runningVehicles">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-warning">
                            <i class="fas fa-exclamation-triangle"></i> Alerts
                        </h5>
                        <h2 id="totalAlerts">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-info">
                            <i class="fas fa-tachometer-alt"></i> Avg Speed
                        </h5>
                        <h2 id="avgSpeed">-</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map and Vehicle Details -->
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-map-marker-alt"></i> Live Fleet Map</h5>
                    </div>
                    <div class="card-body">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-exclamation-triangle"></i> Active Alerts</h5>
                    </div>
                    <div class="card-body">
                        <div id="alertsContainer"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vehicle Cards -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-list"></i> Vehicle Status</h5>
                    </div>
                    <div class="card-body">
                        <div id="vehiclesContainer" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        let map;
        let markers = {};
        let vehicles = [];
        let alerts = [];

        // Initialize map
        function initMap() {
            map = L.map('map').setView([12.9716, 77.5946], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        // Update vehicle markers on map
        function updateMapMarkers() {
            vehicles.forEach(vehicle => {
                const lat = vehicle.location.lat;
                const lon = vehicle.location.lon;
                const vehicleId = vehicle.vehicleId;
                
                if (markers[vehicleId]) {
                    markers[vehicleId].setLatLng([lat, lon]);
                } else {
                    const marker = L.marker([lat, lon]).addTo(map);
                    marker.bindPopup(`
                        <strong>${vehicleId}</strong><br>
                        Speed: ${vehicle.telemetry.speed.toFixed(1)} km/h<br>
                        Fuel: ${vehicle.telemetry.fuelLevel.toFixed(1)}%<br>
                        Status: ${vehicle.telemetry.engineStatus}<br>
                        Route: ${vehicle.telemetry.route}
                    `);
                    markers[vehicleId] = marker;
                }
            });
        }

        // Update analytics
        function updateAnalytics() {
            fetch('/api/vehicles/analytics/summary')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalVehicles').textContent = data.totalVehicles;
                    document.getElementById('runningVehicles').textContent = data.runningVehicles;
                    document.getElementById('totalAlerts').textContent = data.vehiclesWithAlerts;
                    document.getElementById('avgSpeed').textContent = data.averageSpeed + ' km/h';
                    console.log('Analytics updated:', data);
                })
                .catch(error => {
                    console.error('Error updating analytics:', error);
                    // Fallback to manual calculation
                    const vehiclesWithAlerts = vehicles.filter(v => v.alert).length;
                    document.getElementById('totalVehicles').textContent = vehicles.length;
                    document.getElementById('runningVehicles').textContent = vehicles.filter(v => v.telemetry.engineStatus === 'running').length;
                    document.getElementById('totalAlerts').textContent = vehiclesWithAlerts;
                    const avgSpeed = vehicles.reduce((sum, v) => sum + v.telemetry.speed, 0) / vehicles.length;
                    document.getElementById('avgSpeed').textContent = avgSpeed.toFixed(1) + ' km/h';
                });
        }

        // Update alerts
        function updateAlerts() {
            const alertsContainer = document.getElementById('alertsContainer');
            const vehiclesWithAlerts = vehicles.filter(v => v.alert);
            
            if (vehiclesWithAlerts.length === 0) {
                alertsContainer.innerHTML = '<p class="text-muted">No active alerts</p>';
                return;
            }

            alertsContainer.innerHTML = vehiclesWithAlerts.map(vehicle => {
                const alert = vehicle.alert;
                const severityClass = `severity-${alert.severity.toLowerCase()}`;
                return `
                    <div class="alert alert-danger alert-card mb-2">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <strong>${vehicle.vehicleId}</strong>
                                <br><small class="${severityClass}">${alert.type}</small>
                                <br><small>${alert.message}</small>
                            </div>
                            <span class="badge bg-danger">${alert.severity}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update vehicle cards
        function updateVehicleCards() {
            const container = document.getElementById('vehiclesContainer');
            container.innerHTML = vehicles.map(vehicle => {
                const statusClass = vehicle.telemetry.engineStatus === 'running' ? 'status-running' : 'status-stopped';
                const alertBadge = vehicle.alert ? 
                    `<span class="badge bg-danger ms-2">${vehicle.alert.severity}</span>` : '';
                
                return `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card vehicle-card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="mb-0">
                                    <span class="status-indicator ${statusClass}"></span>
                                    ${vehicle.vehicleId}
                                    ${alertBadge}
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-6">
                                        <small class="text-muted">Speed</small>
                                        <div class="h5 mb-0">${vehicle.telemetry.speed.toFixed(1)} km/h</div>
                                    </div>
                                    <div class="col-6">
                                        <small class="text-muted">Fuel</small>
                                        <div class="h5 mb-0">${vehicle.telemetry.fuelLevel.toFixed(1)}%</div>
                                    </div>
                                </div>
                                <hr>
                                <div class="row">
                                    <div class="col-12">
                                        <small class="text-muted">Route</small>
                                        <div class="small">${vehicle.telemetry.route}</div>
                                    </div>
                                </div>
                                ${vehicle.alert ? `
                                    <hr>
                                    <div class="alert alert-sm alert-danger mb-0">
                                        <small><strong>${vehicle.alert.type}:</strong> ${vehicle.alert.message}</small>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Fetch and update data
        function updateData() {
            console.log('Fetching new data...');
            
            // Show loading status
            document.getElementById('statusIndicator').className = 'fas fa-circle text-warning';
            document.getElementById('statusText').textContent = 'Updating...';
            
            fetch('/api/vehicles')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Received vehicle data:', data.length, 'vehicles');
                    vehicles = data;
                    updateMapMarkers();
                    updateVehicleCards();
                    updateAlerts();
                    updateAnalytics();
                    
                    // Update status and timestamp
                    const now = new Date();
                    document.getElementById('statusIndicator').className = 'fas fa-circle text-success';
                    document.getElementById('statusText').textContent = 'Live';
                    document.getElementById('lastUpdate').textContent = now.toLocaleTimeString();
                    console.log('Dashboard updated at:', now.toLocaleTimeString());
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    // Show error status
                    document.getElementById('statusIndicator').className = 'fas fa-circle text-danger';
                    document.getElementById('statusText').textContent = 'Error';
                    // Show error in dashboard
                    document.getElementById('alertsContainer').innerHTML = 
                        '<div class="alert alert-warning">Error fetching data. Retrying in 5 seconds...</div>';
                });
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Initializing kscope dashboard...');
            initMap();
            updateData();
            
            // Update every 1 second (changed from 5 seconds)
            setInterval(updateData, 1000);
            console.log('Dashboard initialized. Updates every 1 second.');
        });

        // Export functions
        function exportTelemetry() {
            console.log('Exporting telemetry data...');
            window.open('/api/vehicles/export/telemetry', '_blank');
        }

        function exportAnalytics() {
            console.log('Exporting analytics data...');
            window.open('/api/vehicles/export/analytics', '_blank');
        }

        function exportVehicleDetails() {
            console.log('Exporting vehicle details...');
            window.open('/api/vehicles/export/vehicle-details', '_blank');
        }
    </script>
</body>
</html>
